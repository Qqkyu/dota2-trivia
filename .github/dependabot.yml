version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    # pnpm patches pin @next/eslint-plugin-next and postgres to exact versions.
    # Dependabot cannot re-apply a patch, so its updater fails on these three.
    # Update them by hand: bump, refresh the patch, run pnpm check.
    ignore:
      - dependency-name: next
      - dependency-name: eslint-config-next
      - dependency-name: postgres
    groups:
      next:
        patterns:
          - next
          - eslint-config-next
      react:
        patterns:
          - react
          - react-dom
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
