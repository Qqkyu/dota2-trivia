name: Queue Arcade CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: queue-arcade-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: queue_arcade
          POSTGRES_USER: queue_arcade
          POSTGRES_PASSWORD: queue_arcade_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U queue_arcade -d queue_arcade"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://queue_arcade:queue_arcade_ci@127.0.0.1:5432/queue_arcade
      DATABASE_POOL_SIZE: 2
      ARCADE_VOTER_SALT: queue-arcade-ci-only
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 9.12.1
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      - run: pnpm check
      - name: Build production container
        run: docker build --tag queue-arcade:ci .
      - name: Start production server
        run: |
          pnpm start > /tmp/queue-arcade-ci.log 2>&1 &
          echo $! > /tmp/queue-arcade-ci.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/queue-arcade-ci.log
          exit 1
      - name: Start muted browser
        run: |
          google-chrome --headless=new --no-sandbox --mute-audio --autoplay-policy=user-gesture-required \
            --disable-gpu --remote-debugging-port=9222 --user-data-dir=/tmp/queue-arcade-ci-chrome \
            about:blank > /tmp/queue-arcade-chrome.log 2>&1 &
          echo $! > /tmp/queue-arcade-chrome.pid
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:9222/json/version > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/queue-arcade-chrome.log
          exit 1
      - name: Verify browser journey silently
        run: node scripts/visual-smoke.mjs
      - name: Verify synchronized Postgres room
        run: pnpm check:multiplayer
      - name: Print server log on failure
        if: failure()
        run: cat /tmp/queue-arcade-ci.log
      - name: Stop production server
        if: always()
        run: |
          if test -f /tmp/queue-arcade-chrome.pid; then
            kill "$(cat /tmp/queue-arcade-chrome.pid)" || true
          fi
          if test -f /tmp/queue-arcade-ci.pid; then
            kill "$(cat /tmp/queue-arcade-ci.pid)" || true
          fi
