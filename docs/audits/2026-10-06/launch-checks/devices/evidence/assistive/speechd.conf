LogLevel 4
LogDir "/tmp/queue-arcade-launch-checks/assistive/session/log"
DefaultLanguage "en-US"
DefaultVoiceType "MALE1"
AddModule "capture" "/tmp/queue-arcade-launch-checks/assistive/root/usr/lib/speech-dispatcher-modules/sd_generic" "capture.conf"
DefaultModule capture
DisableAutoSpawn
AudioOutputMethod "alsa"
AudioALSADevice "null"
